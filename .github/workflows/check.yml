name: Check Easy Street
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-15-intel]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm install --global pnpm@10
      - name: Record environment
        run: |
          uname -sm
          if [[ "$RUNNER_OS" == "macOS" ]]; then sw_vers; fi
          python3 --version
          node --version
          pnpm --version
      - name: Install backend
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r backend/requirements-lock.txt
      - name: Test backend and integration
        run: .venv/bin/python -m pytest backend/tests tests/integration
      - name: Install frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Test frontend
        working-directory: frontend
        run: pnpm test
      - name: Build frontend
        working-directory: frontend
        run: pnpm build
      - name: Test production startup and offline workflow
        run: .venv/bin/python scripts/smoke_startup.py
