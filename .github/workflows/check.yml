name: Check Easy Street
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-15-intel]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm install --global pnpm@10
      - name: Record environment
        run: |
          uname -sm
          if [[ "$RUNNER_OS" == "macOS" ]]; then sw_vers; fi
          python3 --version
          node --version
          pnpm --version
      - name: Install backend
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r backend/requirements-lock.txt
      - name: Install optional local OCR tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
          .venv/bin/python -m pip install -r backend/requirements-ocr.txt
      - name: Test backend and integration
        run: .venv/bin/python -m pytest backend/tests tests/integration
      - name: Test judging shutdown safeguards with mocks
        run: .venv/bin/python -m pytest tests/test_fly_shutdown.py
      - name: Install frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Test frontend
        working-directory: frontend
        run: pnpm test
      - name: Build frontend
        working-directory: frontend
        run: pnpm build
      - name: Test production startup and offline workflow
        run: .venv/bin/python scripts/smoke_startup.py
      - name: Package downloadable app
        run: .venv/bin/python scripts/package_release.py --output "$RUNNER_TEMP/easy-street.zip"
      - name: Test release installation without a frontend build
        run: .venv/bin/python scripts/smoke_release.py "$RUNNER_TEMP/easy-street.zip"
      - name: Keep tested release archive
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: easy-street-download
          path: |
            ${{ runner.temp }}/easy-street.zip
            ${{ runner.temp }}/easy-street.zip.sha256
  retirement-artifact-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare synthetic files
        run: |
          mkdir -p "$RUNNER_TEMP/retirement-action-compat"
          printf 'synthetic ciphertext\n' > "$RUNNER_TEMP/retirement-action-compat/ledger.cms"
          printf '{"fixture":true}\n' > "$RUNNER_TEMP/retirement-action-compat/receipt.json"
      - name: Upload synthetic compatibility artifact
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-retirement-action-compat-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/retirement-action-compat/ledger.cms
            ${{ runner.temp }}/retirement-action-compat/receipt.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Verify artifact metadata, archive digest and contents
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TEST_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          TEST_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: python3 -m scripts.verify_retirement_artifact_compat
