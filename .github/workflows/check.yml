name: Check Easy Street
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-15-intel]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm install --global pnpm@10
      - name: Record environment
        run: |
          uname -sm
          if [[ "$RUNNER_OS" == "macOS" ]]; then sw_vers; fi
          python3 --version
          node --version
          pnpm --version
      - name: Install backend
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r backend/requirements-lock.txt
      - name: Install optional local OCR tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
          .venv/bin/python -m pip install -r backend/requirements-ocr.txt
      - name: Test backend and integration
        run: .venv/bin/python -m pytest backend/tests tests/integration
      - name: Test judging shutdown safeguards with mocks
        run: .venv/bin/python -m pytest tests/test_fly_shutdown.py
      - name: Install frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Test frontend
        working-directory: frontend
        run: pnpm test
      - name: Build frontend
        working-directory: frontend
        run: pnpm build
      - name: Test production startup and offline workflow
        run: .venv/bin/python scripts/smoke_startup.py
      - name: Package downloadable app
        run: .venv/bin/python scripts/package_release.py --output "$RUNNER_TEMP/easy-street.zip"
      - name: Test release installation without a frontend build
        run: .venv/bin/python scripts/smoke_release.py "$RUNNER_TEMP/easy-street.zip"
      - name: Keep tested release archive
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: easy-street-download
          path: |
            ${{ runner.temp }}/easy-street.zip
            ${{ runner.temp }}/easy-street.zip.sha256
